name: Release
run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No build step: Sundial is no-build, the image copies the repo
      # files as-is. version.json is committed (bumped by `just set-version`).

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/freeshardbase/sundial:${{ github.event.release.tag_name }}
