name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # uv runs tools/dev_server.py with its inline script deps (aiohttp)
      - uses: astral-sh/setup-uv@v5

      - name: Install dev dependencies from the lockfile
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: i18n catalog consistency
        run: python3 tools/check_i18n.py

      - name: Unit tests (node:test)
        run: npm run test:unit

      # Playwright's webServer starts the mock-API dev server itself
      - name: E2e + no-build smoke (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
