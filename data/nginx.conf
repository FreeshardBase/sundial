# Serves Sundial at / — the core-release drop-in replacing web-terminal's
# default.conf. The app stays subpath-aware in code, but this container
# serves root only (the /sundial/ coexistence setup lives in deploy/).
server {
	listen 80;
	server_name _;

	root /srv;
	index index.html;

	# Security headers — keep the CSP identical to the <meta> fallback in
	# index.html (that tag is the source of truth; the sha256 hash allows
	# exactly the inline import map). frame-ancestors only works as a
	# header, which is why it appears here and not in the meta.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4DM4CMWl4rDiWDZUPdH6jQfjmf280TqxsNEgfxOudzI='; style-src 'self'; img-src 'self' https://storageaccountportab0da.blob.core.windows.net; connect-src 'self' https://storageaccountportab0da.blob.core.windows.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;

	# SPA fallback for History-API routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# This image's mime.types has no entry for .webmanifest
	location = /manifest.webmanifest {
		default_type application/manifest+json;
	}

	# ...nor for .mjs (vendor ESM) — octet-stream would fail module loading
	location ~ \.mjs$ {
		default_type application/javascript;
	}

	# Updates must propagate: never cache the entry point, the service
	# worker, or the version probe. expires -1 sends Cache-Control:
	# no-cache without suppressing the inherited add_header set above.
	location ~ ^/(index\.html|sw\.js|version\.json)$ {
		expires -1;
	}
}
