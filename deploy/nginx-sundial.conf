# Replacement for the web-terminal container's /etc/nginx/conf.d/default.conf.
# Serves the classic app at / (unchanged) and Sundial at /sundial/ with an
# SPA fallback for its History-API routes.
server {
	listen 80;
	server_name _;

	location / {
		root /srv;
	}

	# Sundial computes its base path as "document path up to the last slash",
	# so /sundial must always be entered with a trailing slash.
	location = /sundial {
		return 301 /sundial/;
	}

	location /sundial/ {
		root /srv;
		try_files $uri $uri/ /sundial/index.html;

		# Security headers — keep the CSP identical to the <meta> fallback in
		# Sundial's index.html (that tag is the source of truth; the sha256
		# hash allows exactly the inline import map). frame-ancestors only
		# works as a header, which is why it appears here and not in the meta.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4DM4CMWl4rDiWDZUPdH6jQfjmf280TqxsNEgfxOudzI='; style-src 'self'; img-src 'self' https://storageaccountportab0da.blob.core.windows.net; connect-src 'self' https://storageaccountportab0da.blob.core.windows.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "same-origin" always;
	}
}
